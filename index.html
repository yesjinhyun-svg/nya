<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CAT TOWER — 고양이의 등반</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;background:#f8ead8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;color:#5b4637}
#score{position:absolute;top:18px;left:18px;background:#fff8edcc;border:2px solid #e8c9a8;border-radius:18px;padding:10px 16px;font-weight:900;font-size:20px;box-shadow:0 4px 0 #d9b18b}
#hint{position:absolute;top:18px;right:18px;background:#fff8edcc;border:2px solid #e8c9a8;border-radius:16px;padding:9px 12px;font-size:12px;font-weight:700;text-align:right}
#toast{position:absolute;top:84px;left:50%;transform:translate(-50%,-10px);padding:10px 18px;border-radius:999px;font-weight:900;font-size:16px;color:#fff;text-shadow:0 1px 2px #0006;background:linear-gradient(90deg,#ff5f6d,#ffc371,#47e891,#4facfe,#a66cff);box-shadow:0 4px 0 #0003;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#mute{position:fixed;top:78px;left:18px;z-index:6;width:44px;height:44px;padding:0;font-size:20px;line-height:1;border-radius:50%;background:#fff8edcc;border:2px solid #e8c9a8;box-shadow:0 4px 0 #d9b18b;color:#5b4637;touch-action:none;-webkit-tap-highlight-color:transparent}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#6b503b33;pointer-events:auto;z-index:4}
.panel{width:min(88vw,390px);padding:25px 22px 22px;border-radius:28px;background:#fff8ed;border:3px solid #e5c29e;box-shadow:0 8px 0 #c99f77;text-align:center}
h1{margin:0;color:#bd8051;font-size:32px;letter-spacing:1px} .sub{color:#82644d;font-weight:700;margin:8px 0 16px}
button{border:0;border-radius:18px;background:#e99c62;color:white;font-size:19px;font-weight:900;padding:14px 28px;box-shadow:0 5px 0 #bd7546;cursor:pointer;pointer-events:auto}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #bd7546}
#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));pointer-events:none;z-index:5}
.ctrl{width:clamp(64px,18vw,82px);height:clamp(64px,18vw,82px);border-radius:50%;font-size:26px;background:#fff6e8dd;color:#916749;border:3px solid #e3c19c;box-shadow:0 5px 0 #cda77f;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
#jump{width:clamp(78px,22vw,96px);height:clamp(78px,22vw,96px);background:#e99c62;color:#fff;border-color:#d58b56}
.small{font-size:13px;line-height:1.5;color:#98775c}
@media(max-height:480px){.panel{padding:14px 18px 16px}.panel h1{font-size:25px}.sub{margin:4px 0 8px}.small{font-size:11px}#controls{bottom:max(8px,env(safe-area-inset-bottom))}.ctrl{width:58px;height:58px}#jump{width:68px;height:68px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="score">🏆 0</div><div id="hint">← → 이동　 SPACE 점프<br>모바일은 버튼 사용</div><div id="toast">🌈 레인보우 버프! 생선을 먹어요 🐟</div></div>
<div id="overlay"><div class="panel"><h1>🐾 CAT TOWER</h1><div class="sub">냥이의 끝없는 등반!</div><p class="small">캣타워 가까운 발판을 하나씩 올라가세요.<br>발판을 놓치면 게임 오버!<br>좌우 이동 + 점프로 최고 점수에 도전해요.<br>무지개 버프가 켜지면 🐟 생선을 먹어요!</p><button id="start">게임 시작!</button></div></div>
<button id="mute" aria-label="소리 켜기/끄기">🔊</button>
<div id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="jump">🐾</button><button class="ctrl" id="right">▶</button></div>
<script>
// ===== 난이도/연출 조절용 설정값 (여기 숫자만 바꿔도 튜닝 가능) =====
const GAP_MIN=75, GAP_MAX=105;          // 발판 사이 세로 간격(px) — 이 범위에서 랜덤 (점프 최대 높이는 약 112px)
const STEP_MIN=60, STEP_MAX=170;        // 다음 발판까지 좌우로 벌어지는 거리(px, 발판 중심 기준)
const FLIP_CHANCE=.65;                  // 이동 방향을 반대로 바꿀 확률 (높을수록 좌우로 왔다갔다, 낮을수록 한쪽으로 진행)
const BLINK_PERIOD=0.4, BLINK_COUNT=3;  // 사라지는 발판: 1회 깜박임 시간(초) / 깜박임 횟수
const SPRING_BOOST=1.5;                 // 점프대 도약 "높이" 배수 (높이는 속도²에 비례하므로 속도는 √배수)
const SPRING_VY=-650*Math.sqrt(SPRING_BOOST);
const BACKUP_W=84, BACKUP_SPEED=[55,75]; // 예비(이동) 발판: 너비 / 이동 속도 범위(px/초)
const PX_PER_POINT=50;                  // 높이 점수 환산: 올라간 높이 50px = 1포인트 (500px = 10포인트)
const BUFF_AT_POINTS=30, BUFF_SECONDS=10; // 높이 점수가 이 값에 도달하면 무지개 버프 발동 / 유지 시간(초)
const FISH_POINTS=10;                   // 생선 1개를 먹으면 추가되는 포인트
const FISH_MAX=5, FISH_SPAWN=[.5,1];    // 버프 중 화면에 동시에 있을 수 있는 생선 수 / 생성 간격(초) 범위
const MUSIC_BPM=96;                     // 배경음 템포 (낮을수록 느림)

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),toast=document.getElementById('toast');
let W,H,dpr,platforms=[],chainLast,cat,groundY=0,maxH=0,cam=0,playing=false,keys={},held={left:false,right:false},last=0,T=0,buff=false,buffLeft=0,buffUsed=false,bonus=0,fishTimer=0,floaters=[],shownScore=-1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=document.documentElement.clientWidth;H=window.visualViewport?window.visualViewport.height:window.innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);if(!playing)initWorld()}window.addEventListener("resize",resize);if(window.visualViewport)window.visualViewport.addEventListener("resize",resize);
function rand(a,b){return a+Math.random()*(b-a)}
function hsl(h,s,l,a=1){return `hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`}
function curScore(){return Math.floor(maxH/PX_PER_POINT)+bonus}   // 화면 점수 = 높이 점수 + 생선 보너스 (단위 표시 없음)
// 버프 중: 화면에 보이는 발판 위에 생선을 랜덤으로 하나 올린다
function spawnFish(){
 let alive=0;for(const p of platforms)if(p.fish&&!p.broken)alive++;
 if(alive>=FISH_MAX)return;
 const c=platforms.filter(p=>!p.broken&&!p.fish&&p!==cat.stand&&p.y-cam>30&&p.y-cam<H*.8);
 if(!c.length)return;
 const p=c[(Math.random()*c.length)|0];p.fish={off:rand(18,p.w-18),born:T};
}

// ===== 소리: 외부 파일 없이 Web Audio로 직접 합성 =====
const Snd=(()=>{
 let ac=null,master,musicBus,sfxBus,noiseBuf,timer=null,nextT=0,stepI=0,muted=false;
 try{muted=localStorage.getItem('nya-muted')==='1'}catch(_){}
 const STEP=60/MUSIC_BPM/2;                          // 8분음표 1스텝(초)
 const hz=m=>440*Math.pow(2,(m-69)/12);
 const btn=document.getElementById('mute');
 const paint=()=>{btn.textContent=muted?'🔇':'🔊'};
 // 16스텝(=2마디) 멜로디 [시작스텝, MIDI, 길이(스텝)] : "냥냥냥~ 냥냥냥냥~" (두 번째 반복은 한 음 높게)
 const MEL=[
  [[0,67,1],[1,69,1],[2,72,2.4],[8,76,1],[9,74,1],[10,72,1],[11,67,2.6]],
  [[0,69,1],[1,72,1],[2,76,2.4],[8,79,1],[9,76,1],[10,74,1],[11,72,2.6]]
 ];
 const BASS=[[0,48],[4,55],[8,53],[12,60]];                                   // 통통 튀는 베이스
 const STAB=[[2,[60,64]],[6,[60,64]],[10,[57,65]],[14,[57,65]]];              // 엇박 반주

 function build(ctx){
  ac=ctx;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-16;comp.knee.value=20;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.25;
  master=ac.createGain();master.gain.value=muted?0:1;
  musicBus=ac.createGain();musicBus.gain.value=.5;
  sfxBus=ac.createGain();sfxBus.gain.value=.8;
  musicBus.connect(master);sfxBus.connect(master);master.connect(comp);comp.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }
 // 고양이 "냥" 한 음절: 톱니파 + 모음(ㅑ) 필터 + 음높이 미끄러짐 + 약한 비브라토
 function nya(t,midi,dur,vol){
  const f=hz(midi),o=ac.createOscillator(),env=ac.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(f*.85,t);
  o.frequency.exponentialRampToValueAtTime(f,t+.08);               // "ny~" 아래에서 치고 올라오는 느낌
  o.frequency.setValueAtTime(f,t+dur*.6);
  o.frequency.linearRampToValueAtTime(f*.95,t+dur);                // "~a" 끝에서 살짝 내려감
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=5.5;lg.gain.value=f*.012;lfo.connect(lg);lg.connect(o.frequency);
  const f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter(),g1=ac.createGain(),g2=ac.createGain();
  f1.type='bandpass';f2.type='bandpass';f1.Q.value=5;f2.Q.value=7;
  f1.frequency.setValueAtTime(420,t);f1.frequency.linearRampToValueAtTime(850,t+.1);     // 모음이 "니"에서 "아"로 열림
  f2.frequency.setValueAtTime(2300,t);f2.frequency.linearRampToValueAtTime(1350,t+.1);
  g1.gain.value=1;g2.gain.value=.6;
  o.connect(f1);o.connect(f2);f1.connect(g1);f2.connect(g2);g1.connect(env);g2.connect(env);
  env.gain.setValueAtTime(.0001,t);env.gain.exponentialRampToValueAtTime(vol,t+.03);
  env.gain.setValueAtTime(vol,t+dur*.7);env.gain.exponentialRampToValueAtTime(.0001,t+dur);
  env.connect(musicBus);
  o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05);
 }
 function pluck(t,midi,dur,vol){
  const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=hz(midi);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+dur+.02);
 }
 function tick(t,vol){
  const s=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;hp.type='highpass';hp.frequency.value=6500;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);
  s.connect(hp);hp.connect(g);g.connect(musicBus);s.start(t,Math.random()*.5);s.stop(t+.05);
 }
 function scheduleStep(i,t){
  const s=i%16,lp=Math.floor(i/16)%2;
  for(const [st,m,d] of MEL[lp])if(st===s)nya(t,m,d*STEP,.9);
  for(const [st,m] of BASS)if(st===s)pluck(t,m,.3,.5);
  for(const [st,ms] of STAB)if(st===s)for(const m of ms)pluck(t,m,.14,.1);
  tick(t,s%2?.05:.02);
 }
 function pump(){
  if(!ac)return;
  if(nextT<ac.currentTime-.3)nextT=ac.currentTime+.05;             // 탭이 멈췄다 돌아와도 음이 몰아서 나오지 않게
  while(nextT<ac.currentTime+.3){scheduleStep(stepI,nextT);nextT+=STEP;stepI++}
 }
 function startMusic(){if(!ac||timer)return;nextT=ac.currentTime+.1;stepI=0;pump();timer=setInterval(pump,80)}

 // ---- 효과음 ----
 function tone(t,type,f0,f1,dur,vol,wob){
  const o=ac.createOscillator(),g=ac.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur*.85);
  if(wob){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=wob;lg.gain.value=(f0+f1)*.03;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur+.02)}
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+.02);
 }
 function whoosh(t,f0,f1,dur,vol,q){
  const s=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();
  s.buffer=noiseBuf;bp.type='bandpass';bp.Q.value=q;
  bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp);bp.connect(g);g.connect(sfxBus);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
 }
 function ping(t,f,dur,vol){tone(t,'sine',f,f*1.001,dur,vol);tone(t,'triangle',f*2,f*2.002,dur*.6,vol*.25)}
 // 점프: 트램폴린 '슝' (올라가는 소리 + 위로 훑는 바람)
 function jump(t){if(!ac||muted)return;t=t||ac.currentTime;tone(t,'sine',280,950,.17,.5);tone(t,'triangle',560,1900,.14,.12);whoosh(t,600,3200,.2,.45,1.1)}
 // 점프대: 더 길고 높게 '쀼웅~슝'
 function spring(t){if(!ac||muted)return;t=t||ac.currentTime;tone(t,'sine',200,1500,.34,.55,30);tone(t,'triangle',400,3000,.26,.14);whoosh(t,500,4800,.38,.5,1)}
 // 생선: 띠링!
 function fish(t){if(!ac||muted)return;t=t||ac.currentTime;ping(t,988,.16,.35);ping(t+.07,1319,.24,.35)}
 // 버프 발동: 반짝이는 상승 아르페지오
 function buff(t){if(!ac||muted)return;t=t||ac.currentTime;[1047,1319,1568,2093].forEach((f,i)=>ping(t+i*.08,f,.3,.22))}

 function toggle(){
  muted=!muted;try{localStorage.setItem('nya-muted',muted?'1':'0')}catch(_){}
  if(ac&&master)master.gain.setTargetAtTime(muted?0:1,ac.currentTime,.03);
  paint();
 }
 // 브라우저는 사용자의 터치/클릭 뒤에만 소리를 허용하므로 "게임 시작" 버튼에서 호출한다
 function init(){
  if(!ac){
   const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
   try{build(new AC())}catch(_){ac=null;return}
   document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()});
  }
  if(ac.state==='suspended')ac.resume();
 }
 btn.addEventListener('pointerdown',e=>{e.preventDefault();toggle()});
 paint();
 return {init,startMusic,jump,spring,fish,buff,toggle,build,nya,scheduleStep,MEL,STEP,get ac(){return ac}};
})();
function makeGrain(){return Array.from({length:5},()=>[rand(5,12),rand(-1,2)])}

// ===== 타워 생성 =====
// type 0 일반 / 1 깜박이다 사라짐 / 2 점프대 / 3 좌우로 움직이는 예비 발판
function mk(x,y,w,type,floor,dir){return {x,y,w,type,broken:false,triggered:false,t:0,floor,dir,grain:makeGrain()}}
// 이전 발판(prev)을 기준으로 다음 층 발판을 만든다. 이동 방향을 높은 확률로 뒤집어서 좌우로 왔다갔다 하게 한다.
function nextChain(prev,floor,forceDir){
 let dir=forceDir||(Math.random()<FLIP_CHANCE?-prev.dir:prev.dir),step=rand(STEP_MIN,STEP_MAX),minX=20,maxX=W-145;
 let nx=prev.x+dir*step;
 if(nx<minX||nx>maxX){dir=-dir;nx=prev.x+dir*step}   // 벽에 부딪히면 반대 방향으로 튕김
 nx=Math.max(minX,Math.min(maxX,nx));
 let type=floor<3?0:(Math.random()<.12?2:(Math.random()<.2?1:0));
 return mk(nx,prev.y-rand(GAP_MIN,GAP_MAX),rand(105,130),type,floor,dir);
}
// 깜박이는 발판 t와 같은 높이에, 벽 쪽 한 방향(side)으로 좌우로 움직이는 예비 발판을 만든다.
function makeBackup(t,side){
 let lo,hi; // 예비 발판의 왼쪽 끝(x)이 움직이는 범위
 if(side<0){hi=t.x-22-BACKUP_W;lo=Math.max(20,hi-130)}
 else{lo=t.x+t.w+22;hi=Math.min(W-20-BACKUP_W,lo+130)}
 if(hi-lo<30)return null; // 공간이 모자라면 만들지 않음
 let b=mk(rand(lo,hi),t.y,BACKUP_W,3,t.floor,side);
 b.minX=lo;b.maxX=hi;b.vx=(Math.random()<.5?-1:1)*rand(BACKUP_SPEED[0],BACKUP_SPEED[1]);b.dx=0;
 return b;
}
// 한 층을 위로 쌓는다. 깜박이는 발판이 나오면 [아래 발판 → 깜박이는 발판 → 위 발판]을 지그재그로 배치해서
// 아래/위 발판이 모두 같은 쪽에 오게 하고, 그 반대쪽 같은 높이에 예비 발판을 둔다. (놓쳐도 다시 올라갈 수 있게)
function extendTower(){
 let a=chainLast,t=nextChain(a,a.floor+1);
 if(t.type===1){
  let c=nextChain(t,t.floor+1,-t.dir);if(c.type===1)c.type=0;
  let tc=t.x+t.w/2,side=Math.sign(a.x+a.w/2-tc),cs=Math.sign(c.x+c.w/2-tc);
  let bk=(side!==0&&side===cs)?makeBackup(t,side):null;
  if(!bk)t.type=0; // 예비 발판을 둘 수 없는 자리면 그냥 일반 발판으로
  platforms.push(t);if(bk)platforms.push(bk);platforms.push(c);chainLast=c;return;
 }
 platforms.push(t);chainLast=t;
}
function initWorld(){
 let baseY=H-110;groundY=baseY;
 platforms=[mk(W/2-65,baseY,130,0,0,1)];chainLast=platforms[0];
 while(chainLast.y>-400)extendTower();
 cat={x:W/2,y:baseY-21,vx:0,vy:0,w:36,h:42,on:false,stand:null};cam=0;maxH=0;bonus=0;fishTimer=0;floaters=[];shownScore=-1;buff=false;buffLeft=0;buffUsed=false;
 toast.classList.remove('show');document.getElementById('score').textContent='🏆 0';
}
function showToast(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2400)}
function start(){Snd.init();Snd.startMusic();initWorld();playing=true;document.getElementById('overlay').style.display='none';cat.vy=-540;Snd.jump()}
function doJump(){if(playing&&cat.on){cat.vy=-540;cat.on=false;Snd.jump()}}
document.getElementById('start').onclick=start;
function bindHold(id,dir){let el=document.getElementById(id);let on=e=>{e.preventDefault();held[dir]=true;try{el.setPointerCapture(e.pointerId)}catch(_){}};let off=e=>{if(e)e.preventDefault();held[dir]=false};el.addEventListener("pointerdown",on);["pointerup","pointercancel","lostpointercapture","pointerleave"].forEach(t=>el.addEventListener(t,off));el.addEventListener("contextmenu",e=>e.preventDefault())}
bindHold('left','left');bindHold('right','right');
document.getElementById("jump").addEventListener("pointerdown",e=>{e.preventDefault();doJump()});document.getElementById("jump").addEventListener("contextmenu",e=>e.preventDefault());window.addEventListener("blur",()=>{held.left=false;held.right=false;keys={}});
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();doJump()}if(e.code==='KeyM')Snd.toggle()});
window.addEventListener('keyup',e=>keys[e.code]=false);
function drawPlatform(p,y){
 // 사라지는 발판: 밟은 뒤 깜박이는 동안 반투명 <-> 불투명을 반복
 if(p.type===1&&p.triggered&&(p.t%BLINK_PERIOD)/BLINK_PERIOD>=.5)ctx.globalAlpha=.18;
 let fill=p.type===1?'#d8b47e':p.type===2?'#efd0d2':p.type===3?'#a9d6c4':'#d9ad79';
 ctx.lineJoin='round';ctx.lineWidth=3;ctx.strokeStyle='#493b30';
 round(p.x,y,p.w,18,7);ctx.fillStyle=fill;ctx.fill();ctx.stroke();
 ctx.strokeStyle=p.type===3?'#e4f6ee':'#f3d9a8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+9,y+5);ctx.quadraticCurveTo(p.x+p.w*.45,y+1,p.x+p.w-9,y+5);ctx.stroke();
 if(p.type!==3){
  // short irregular grain marks give the wood a brushed, illustrated feel (발판마다 고정된 값을 써서 깜빡이지 않음)
  ctx.strokeStyle='#ae8057';ctx.lineWidth=1.2;
  for(let i=0;i<Math.floor(p.w/27);i++){let xx=p.x+15+i*27,g=p.grain[i];ctx.beginPath();ctx.moveTo(xx,y+11);ctx.lineTo(xx+g[0],y+10+g[1]);ctx.stroke()}
 }
 if(p.type===1){
   ctx.strokeStyle='#6b513a';ctx.lineWidth=2;
   for(let x=p.x+12;x<p.x+p.w-8;x+=12){ctx.beginPath();ctx.moveTo(x,y+7);ctx.lineTo(x+5,y+15);ctx.stroke()}
 }
 if(p.type===2){ctx.fillStyle='#fff8e8';for(let x=p.x+15;x<p.x+p.w-10;x+=22){ctx.beginPath();ctx.arc(x,y-2,3,0,Math.PI*2);ctx.fill()}}
 if(p.type===3){ // 좌우로 움직인다는 표시(◀ ▶)
  ctx.fillStyle='#4f7f6d';let cy=y+10;
  ctx.beginPath();ctx.moveTo(p.x+13,cy);ctx.lineTo(p.x+22,cy-5);ctx.lineTo(p.x+22,cy+5);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(p.x+p.w-13,cy);ctx.lineTo(p.x+p.w-22,cy-5);ctx.lineTo(p.x+p.w-22,cy+5);ctx.closePath();ctx.fill();
 }
 ctx.globalAlpha=1;
}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawFish(x,y,born){
 let a=Math.max(0,Math.min(1,(T-born)/.3)),b=a-1,s=1+2.70158*b*b*b+1.70158*b*b;   // 톡 튀어나오는 팝인(easeOutBack)
 ctx.save();ctx.translate(x,y+Math.sin(T*5+x*.05)*2.5);ctx.scale(s,s);
 ctx.fillStyle='#8fd3f4';ctx.strokeStyle='#40362e';ctx.lineWidth=2;ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(-17,-7);ctx.lineTo(-15,0);ctx.lineTo(-17,7);ctx.closePath();ctx.fill();ctx.stroke();   // 꼬리
 ctx.beginPath();ctx.ellipse(0,0,11,7.5,0,0,Math.PI*2);ctx.fill();ctx.stroke();                                                // 몸통
 ctx.fillStyle='#e9f7ff';ctx.beginPath();ctx.ellipse(1,3,7,3,0,0,Math.PI*2);ctx.fill();                                          // 배
 ctx.fillStyle='#40362e';ctx.beginPath();ctx.arc(6,-2,1.7,0,Math.PI*2);ctx.fill();                                               // 눈
 ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(1,-5);ctx.quadraticCurveTo(-1,0,1,5);ctx.stroke();                                 // 아가미
 ctx.restore();
}
function drawFloaters(){
 if(!floaters.length)return;
 ctx.save();ctx.textAlign='center';ctx.font='900 22px system-ui,sans-serif';ctx.lineWidth=5;ctx.lineJoin='round';
 for(let f of floaters){let k=f.t/.9,y=f.y-cam-18-k*46;ctx.globalAlpha=1-k*k;ctx.strokeStyle='#fff';ctx.strokeText('+'+FISH_POINTS,f.x,y);ctx.fillStyle='#e0613a';ctx.fillText('+'+FISH_POINTS,f.x,y)}
 ctx.restore();
}
function drawCat(x,y){
 let body='#fffaf0',tail='#e7bd65',ear='#e98f91';
 if(buff){
  // 무지개 버프: 색이 계속 바뀌며 깜박이고, 주위로 빛이 번짐
  let h=T*240,pulse=.5+.5*Math.sin(T*12),r=46+10*pulse,g=ctx.createRadialGradient(x,y+10,6,x,y+10,r);
  g.addColorStop(0,hsl(h,100,70,.8));g.addColorStop(.6,hsl(h+120,100,65,.35));g.addColorStop(1,hsl(h+240,100,60,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y+10,r,0,Math.PI*2);ctx.fill();
  body=hsl(h,100,80+10*pulse);tail=hsl(h+180,100,60);ear=hsl(h+90,100,72);
  ctx.shadowColor=hsl(h+60,100,60);ctx.shadowBlur=12+14*pulse;
 }
 // body
 ctx.fillStyle=body;ctx.strokeStyle='#40362e';ctx.lineWidth=2.8;ctx.beginPath();ctx.ellipse(x,y+17,15,17,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 // tail
 ctx.strokeStyle=tail;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+11,y+25);ctx.quadraticCurveTo(x+28,y+26,x+23,y+11);ctx.stroke();
 // head
 ctx.fillStyle=body;ctx.strokeStyle='#40362e';ctx.lineWidth=2.8;ctx.beginPath();ctx.arc(x,y-4,17,0,Math.PI*2);ctx.fill();ctx.stroke();
 // ears
 ctx.beginPath();ctx.moveTo(x-13,y-14);ctx.lineTo(x-17,y-27);ctx.lineTo(x-5,y-20);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+12,y-14);ctx.lineTo(x+17,y-27);ctx.lineTo(x+5,y-20);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.shadowBlur=0;
 // inner ears
 ctx.fillStyle=ear;ctx.beginPath();ctx.moveTo(x-14,y-19);ctx.lineTo(x-15,y-24);ctx.lineTo(x-9,y-21);ctx.fill();ctx.beginPath();ctx.moveTo(x+14,y-19);ctx.lineTo(x+15,y-24);ctx.lineTo(x+9,y-21);ctx.fill();
 // face
 ctx.fillStyle='#49382d';ctx.beginPath();ctx.arc(x-6,y-5,2.2,0,Math.PI*2);ctx.arc(x+6,y-5,2.2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#df7775';ctx.beginPath();ctx.arc(x,y+1,2.4,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#705344';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,y+3);ctx.quadraticCurveTo(x-4,y+7,x-7,y+4);ctx.moveTo(x,y+3);ctx.quadraticCurveTo(x+4,y+7,x+7,y+4);ctx.stroke();
 // whiskers
 ctx.strokeStyle='#fff3dc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x-7,y+1);ctx.lineTo(x-20,y-1);ctx.moveTo(x-7,y+4);ctx.lineTo(x-20,y+6);ctx.moveTo(x+7,y+1);ctx.lineTo(x+20,y-1);ctx.moveTo(x+7,y+4);ctx.lineTo(x+20,y+6);ctx.stroke();
}
function background(){
 if(buff){
  // 무지개 그라데이션이 위아래로 흐르고, 부드럽게 밝아졌다 어두워지며 깜박임
  let g=ctx.createLinearGradient(0,0,0,H),base=T*180;
  for(let i=0;i<=6;i++)g.addColorStop(i/6,hsl(base+i*60,95,78));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,'+(.12+.12*Math.sin(T*10)).toFixed(3)+')';ctx.fillRect(0,0,W,H);
 }else{ctx.fillStyle='#fff0a8';ctx.fillRect(0,0,W,H)}
 // wall stripes and cozy decor
 ctx.fillStyle=buff?'rgba(255,255,255,.25)':'#f5dfa0';for(let x=0;x<W;x+=80)ctx.fillRect(x,0,1,H);
 ctx.fillStyle=buff?'rgba(255,255,255,.35)':'#f8e6b6';ctx.beginPath();ctx.arc(W-42,120,35,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#d9b38e';ctx.fillRect(0,H-35,W,35);
 // tiny framed picture
 ctx.fillStyle='#e9c5a1';round(20,110,54,62,5);ctx.fill();ctx.fillStyle='#fff1de';round(25,115,44,52,3);ctx.fill();
 ctx.fillStyle='#e5a66d';ctx.beginPath();ctx.arc(47,142,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7e2c4';ctx.beginPath();ctx.arc(47,142,7,0,Math.PI*2);ctx.fill();
}
function update(dt){
 // 좌우로 움직이는 예비 발판 이동 + 그 위에 서 있는 고양이도 같이 실어 나름
 for(let p of platforms){if(p.type===3){let ox=p.x;p.x+=p.vx*dt;if(p.x<p.minX){p.x=p.minX;p.vx=Math.abs(p.vx)}else if(p.x>p.maxX){p.x=p.maxX;p.vx=-Math.abs(p.vx)}p.dx=p.x-ox}}
 if(cat.stand&&cat.stand.type===3)cat.x+=cat.stand.dx;
 cat.stand=null;
 let dir=(held.left||keys.ArrowLeft||keys.KeyA?-1:0)+(held.right||keys.ArrowRight||keys.KeyD?1:0);
 cat.vx=dir*260;cat.x+=cat.vx*dt;cat.x=Math.max(18,Math.min(W-18,cat.x));
 let prevY=cat.y;cat.vy+=1250*dt;cat.y+=cat.vy*dt;cat.on=false;
 // 사라지는 발판은 고양이가 밟은 뒤부터 깜박임 시간을 세고, 정해진 횟수만큼 깜박이면 사라짐
 for(let p of platforms){if(p.type===1&&p.triggered&&!p.broken){p.t+=dt;if(p.t>=BLINK_PERIOD*BLINK_COUNT)p.broken=true}}
 if(cat.vy>0){for(let p of platforms){let py=p.y;if(!p.broken&&prevY+cat.h/2<=py&&cat.y+cat.h/2>=py&&cat.x>p.x-10&&cat.x<p.x+p.w+10){cat.y=py-cat.h/2;cat.vy=0;cat.on=true;cat.stand=p;if(p.type===2){cat.vy=SPRING_VY;cat.on=false;Snd.spring()}if(p.type===1&&!p.triggered){p.triggered=true;p.t=0}break}}}
 if(cat.y-cam<H*.42){cam=cat.y-H*.42}
 // add more tower above camera
 let topY=cam-100;while(chainLast.y>topY)extendTower();
 platforms=platforms.filter(p=>p.y-cam<H+150);
 // 점수 = 높이 점수(시작 발판에서 발이 도달한 최고 높이 ÷ PX_PER_POINT) + 생선 보너스. 층 번호와 달리 발판 간격이 불규칙해도 일정하게 오른다.
 let feet=cat.y+cat.h/2;if(groundY-feet>maxH)maxH=groundY-feet;
 // 생선 먹기: 고양이가 생선과 겹치면 +FISH_POINTS
 for(let p of platforms){if(!p.fish||p.broken)continue;let fx=p.x+p.fish.off,fy=p.y-17;if(Math.abs(cat.x-fx)<30&&Math.abs(cat.y-fy)<38){p.fish=null;bonus+=FISH_POINTS;floaters.push({x:fx,y:fy,t:0});Snd.fish()}}
 for(let f of floaters)f.t+=dt;floaters=floaters.filter(f=>f.t<.9);
 let sc=curScore();if(sc!==shownScore){shownScore=sc;document.getElementById('score').textContent='🏆 '+sc}
 // 무지개 버프: 목표 높이 도달 시 1회 발동, BUFF_SECONDS초 동안만 유지
 if(!buffUsed&&maxH/PX_PER_POINT>=BUFF_AT_POINTS){buffUsed=true;buff=true;buffLeft=BUFF_SECONDS;fishTimer=rand(FISH_SPAWN[0],FISH_SPAWN[1]);showToast();Snd.buff();for(let i=0;i<3;i++)spawnFish()}
 if(buff){
  buffLeft-=dt;fishTimer-=dt;
  if(fishTimer<=0){fishTimer=rand(FISH_SPAWN[0],FISH_SPAWN[1]);spawnFish()}   // 버프 중 생선이 랜덤하게 하나씩 생겨남
  if(buffLeft<=0){buff=false;buffLeft=0;for(let p of platforms)p.fish=null}  // 버프가 끝나면 남은 생선도 사라짐
 }
 if(cat.y-cam>H+80){playing=false;buff=false;document.getElementById('overlay').style.display='flex';document.querySelector('.panel').innerHTML=`<h1>😿 게임 오버!</h1><div class="sub">최고 기록: ${curScore()}</div><p class="small">조금만 더 올라갈 수 있었는데!<br>다시 도전해서 기록을 세워봐요.</p><button id="again">다시 도전!</button>`;document.getElementById('again').onclick=start}
}
function draw(){
 background();
 // tower side poles, scrolling wooden structure
 ctx.fillStyle='#c58e61';ctx.fillRect(W*.22,0,13,H);ctx.fillRect(W*.78-13,0,13,H);
 ctx.fillStyle='#d8ac7f';ctx.fillRect(W*.22+3,0,4,H);ctx.fillRect(W*.78-10,0,4,H);
 // decorative rope-like side
 ctx.strokeStyle='#b88354';ctx.lineWidth=5;ctx.setLineDash([12,10]);ctx.beginPath();ctx.moveTo(W*.22+20,0);ctx.lineTo(W*.22+20,H);ctx.moveTo(W*.78-20,0);ctx.lineTo(W*.78-20,H);ctx.stroke();ctx.setLineDash([]);
 for(let p of platforms){let y=p.y-cam;if(y>-30&&y<H+30&&!p.broken){drawPlatform(p,y);if(p.fish)drawFish(p.x+p.fish.off,y-17,p.fish.born)}}
 if(cat)drawCat(cat.x,cat.y-cam);
 drawFloaters();
}
function loop(t){T=t/1000;let dt=Math.min((t-last)/1000,.032)||0;last=t;if(playing)update(dt);draw();requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);
</script>
</body></html>
